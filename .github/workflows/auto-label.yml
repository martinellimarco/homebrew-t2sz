name: Auto-label successful PRs

on:
  check_suite:
    types: [completed]

jobs:
  label:
    if: >
      github.event.check_suite.conclusion == 'success' &&
      github.event.check_suite.pull_requests[0]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Add pr-pull label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.check_suite.pull_requests[0].number }} \
            --repo "$GITHUB_REPOSITORY" --add-label pr-pull
